.report-table{border-collapse:collapse;width:100%;margin-top:1rem;table-layout:fixed}

.report-bar i,.report-axis i{display:block;height:100%;background:var(--green)}

.report-axis-labels{position:relative;height:1.2rem;margin-top:.5rem;font-size:.8rem}

.report-axis-labels span:nth-child(2){left:45%;transform:translateX(-50%)}

hu:[['Mit állít pontosan az előrejelzés?','A 2026. októberi bejegyzés 335 mandátumot becsül a MORENA, PVEM és PT számára. Az abszolút többség esélye 90,5%, a legalább kétharmadé 58,6%, a PT 3%-os arányos képviseleti küszöbének átlépéséé 54%. Ezek modellbecslések, nem választási eredmények.'],['Hogyan készült?','A szerző szerint az eulytix és a Kronikás országos és állami felméréseket, valamint korábbi választási eredményeket alakított 30 000 szimulált választássá, mind az 500 mandátumra. A nyilvános szöveg nem részletezi a súlyokat, mérési dátumokat, bizonytalansági sávokat vagy elosztási feltevéseket.'],['Miért csak 58,6% a kétharmad esélye 335 becsült mandátum mellett?','Egy mandátumbecslés több lehetséges kimenet összefoglalása. Az 58,6% azt mutatja, milyen gyakran ér el a tömb legalább 334 mandátumot a modellben. A forrás nem közli, hogy a 335 átlag, medián vagy más mutató.'],['Mi hiányzik az oldalról?','A bejegyzés nem közöl pártonkénti mandátumszámokat, állami becsléseket, jelölti programokat, idősoros felméréseket vagy egyedi szimulációkat. Ilyen adatokat nem találunk ki. A 165 fennmaradó mandátum 500 és 335 különbsége; eloszlásuk ismeretlen.'],['Mennyire frissek az adatok?','Ez egy rögzített 2026. októberi pillanatkép. A szerző a választásig frissítéseket tervez, de az oldalnak nincs élő adatkapcsolata. A letöltések és megosztott hivatkozások megőrzik a pillanatkép jelölését.']],
fr:[['Que dit réellement la prévision ?','La publication d’octobre 2026 estime 335 sièges pour MORENA, PVEM et PT, 90,5 % de chances de majorité absolue, 58,6 % de chances d’atteindre au moins deux tiers et 54 % de chances que le PT franchisse le seuil de 3 % pour la représentation proportionnelle. Ce sont des estimations, pas des résultats.'],['Comment a-t-elle été produite ?','Selon l’auteur, eulytix et Kronikás ont converti des sondages nationaux et régionaux et des résultats historiques en 30 000 élections simulées couvrant 500 sièges. Le texte public ne précise ni pondérations, ni dates de terrain, ni intervalles d’incertitude, ni hypothèses détaillées de répartition.'],['Pourquoi 335 sièges et seulement 58,6 % de chances d’obtenir deux tiers ?','Un nombre de sièges résume plusieurs issues possibles. Le chiffre de 58,6 % représente la fréquence à laquelle le bloc atteint au moins 334 sièges dans le modèle. La source ne précise pas si 335 est une moyenne, une médiane ou une autre mesure.'],['Quelles informations manquent ?','Le texte ne fournit ni sièges par parti, ni estimations régionales, ni programmes des candidats, ni séries de sondages, ni simulations individuelles. Nous n’inventons pas ces chiffres. Les 165 sièges restants sont calculés par 500 moins 335 ; leur répartition est inconnue.'],['Quelle est la fraîcheur des données ?','Il s’agit d’un instantané d’octobre 2026. L’auteur prévoit des mises à jour jusqu’au scrutin, mais cette page n’a pas de flux de données en direct. Les téléchargements et les liens partagés conservent la date de référence.']],
de:[['Was sagt die Prognose tatsächlich aus?','Der Beitrag vom Oktober 2026 schätzt 335 Sitze für MORENA, PVEM und PT, eine 90,5%-Chance auf die absolute Mehrheit, eine 58,6%-Chance auf mindestens zwei Drittel und eine 54%-Chance, dass PT die 3%-Hürde für die Verhältniswahl überwindet. Das sind Modellschätzungen, keine Wahlergebnisse.'],['Wie wurde sie erstellt?','Laut dem Autor haben eulytix und Kronikás nationale und regionale Umfragen sowie historische Wahlergebnisse in 30.000 simulierte Wahlen für alle 500 Sitze übersetzt. Der öffentliche Beitrag nennt keine Gewichte, Erhebungsdaten, Unsicherheitsintervalle oder detaillierten Verteilungsannahmen.'],['Warum 335 Sitze und nur 58,6 % Chance auf zwei Drittel?','Eine einzelne Sitzzahl fasst verschiedene mögliche Ergebnisse zusammen. Die 58,6 % beschreiben, wie oft der Block im Modell mindestens 334 Sitze erreicht. Die Quelle erklärt nicht, ob 335 ein Mittelwert, Median oder eine andere Zusammenfassung ist.'],['Welche Angaben fehlen?','Der Beitrag enthält keine Sitzzahlen einzelner Parteien, regionalen Schätzungen, Kandidatenprogramme, Umfragezeitreihen oder einzelnen Simulationsläufe. Wir erfinden diese Zahlen nicht. Die übrigen 165 Sitze ergeben sich aus 500 minus 335; ihre Verteilung ist unbekannt.'],['Wie aktuell sind die Daten?','Dies ist eine feste Momentaufnahme vom Oktober 2026. Der Autor plant Aktualisierungen bis zum Wahltag, aber diese Seite hat keinen Live-Datenstrom. Downloads und geteilte Links behalten die Datumsangabe.']]

function renderSources(){const q=$('#search').value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const filtered=organizations.filter(n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q));$('#sourceList').replaceChildren(...filtered.map(n=>{const el=document.createElement('div');el.className='source-item';const icon=document.createElement('span');icon.textContent='↗';el.append(icon,document.createTextNode(n));return el}));if(!filtered.length)$('#sourceList').textContent=t('noResults');$('#sourceCount').textContent=`${filtered.length} / 9 · ${t('sourceCount')}`;}
function scenario(){const n=+$('#seatRange').value;$('#seatOutput').value=n;$('#absoluteGap').textContent=(n>=251?'+':'')+(n-251);$('#superGap').textContent=(n>=334?'+':'')+(n-334);$('#remaining').textContent=500-n;$('#status').textContent=t(n>=334?'statusSuper':n>=251?'statusAbsolute':'statusNone');$('#status').style.background=n>=251?'var(--mint)':'var(--bg)';$('#seatRange').setAttribute('aria-valuetext',`${n} / 500`);updateURL();}
function setLanguage(){document.documentElement.lang=lang;$('#language').value=lang;document.querySelectorAll('[data-t]').forEach(el=>{if(el.dataset.t==='headline')el.innerHTML=t(el.dataset.t);else el.textContent=t(el.dataset.t)});document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));$('#search').setAttribute('aria-label',t('search'));$('#hemicycle').setAttribute('aria-label',chartParties.map(([name,,seats])=>`${name}: ${seats}`).join(', ')+'. '+reportCopy[lang][13]);$('#seatgrid').setAttribute('aria-label',`${t('bloc')}: 335; ${t('remainder')}: 165`);$('#faqs').replaceChildren(...faq[lang].map(([q,a])=>{const d=document.createElement('details');const s=document.createElement('summary');s.textContent=q;const p=document.createElement('p');p.textContent=a;d.append(s,p);return d}));$('#party-forecast').innerHTML=reportPanel(lang);renderSources();scenario();localStorage.setItem('mx-language',lang);}
$('#language').addEventListener('change',e=>{lang=e.target.value;setLanguage()});$('#search').addEventListener('input',renderSources);$('#seatRange').addEventListener('input',scenario);$('#reset').addEventListener('click',()=>{$('#seatRange').value=335;scenario()});
let dark=localStorage.getItem('mx-theme')==='dark';document.body.classList.toggle('dark',dark);$('#theme').addEventListener('click',()=>{dark=!dark;document.body.classList.toggle('dark',dark);localStorage.setItem('mx-theme',dark?'dark':'light');$('#theme').setAttribute('aria-pressed',dark)});
for(let i=0;i<500;i++){const s=document.createElement('span');s.className='seat'+(i<335?' g':'');$('#seatgrid').append(s)}
const ns='http://www.w3.org/2000/svg';let dots=[];for(let r=0;r<10;r++){let count=23+6*r;for(let j=0;j<count;j++){const theta=Math.PI*(j/(count-1));dots.push({x:300+(110+r*19)*Math.cos(theta),y:292-(110+r*19)*Math.sin(theta),theta})}}// 500 dots, arranged in ten semicircular rows.
const partyColors = {
  MORENA: '#891d41', PVEM: '#e59aad', PT: '#c44e69',
  MC: '#ed7825', PRI: '#7da0df', PAN: '#2b59b8'
};
const chartParties = Object.keys(partyColors).map(name => partyForecast.find(row => row[0] === name));
const dotColors = chartParties.flatMap(([name, , seats]) => Array(seats).fill(partyColors[name]));
dotColors.splice(335, 0, '#a2a8b2'); // Rounding remainder.
dots.sort((a,b)=>b.theta-a.theta);
dots.forEach((dot, index) => {
  const circle = document.createElementNS(ns, 'circle');
  circle.setAttribute('cx', dot.x);
  circle.setAttribute('cy', dot.y);
  circle.setAttribute('r', 3.4);
  circle.setAttribute('fill', dotColors[index]);
  $('#hemicycle').append(circle);
});
$('#party-legend').innerHTML = chartParties.map(([name, , seats]) =>
  `<span><i class="dot" style="background:${partyColors[name]}"></i>${name} <b>${seats}</b></span>`
).join('');
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b)});$('#seatgrid').hidden=b.dataset.view!=='grid';$('#seatgrid').style.display=b.dataset.view==='grid'?'grid':'none';$('#seatbar').hidden=b.dataset.view!=='bar'}));
$('#download').addEventListener('click',()=>{const rows=[['metric','value','unit','status','snapshot','source'],['governing_bloc_seats',335,'seats','published','2026-10',sourceURL],['absolute_majority_probability',90.5,'percent','published','2026-10',sourceURL],['two_thirds_probability',58.6,'percent','published','2026-10',sourceURL],['pt_threshold_probability',54,'percent','published','2026-10',sourceURL],['simulations',30000,'elections','published','2026-10',sourceURL],['total_seats',500,'seats','published','2026-10',sourceURL],['remaining_seats',165,'seats','derived: 500 - 335','2026-10',sourceURL],['at_least_300_probability',75.5,'percent','published','2026-10',sourceURL],['bloc_90_percent_range_low',225,'seats','published','2026-10',sourceURL],['bloc_90_percent_range_high',401,'seats','published','2026-10',sourceURL],['rounding_remainder',1,'seat','published','2026-10',sourceURL], ...partyForecast.flatMap(([party,vote,seats])=>[[party+'_mean_vote_share',vote,'percent','published','2026-10',sourceURL],[party+'_central_seats',seats,'seats','published','2026-10',sourceURL]])];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mexico-2027-forecast-october-2026.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
$('#print').addEventListener('click',()=>{const open=[...document.querySelectorAll('details')].map(d=>d.open);document.querySelectorAll('details').forEach(d=>d.open=true);window.print();document.querySelectorAll('details').forEach((d,i)=>d.open=open[i])});
$('#share').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);$('#toast').textContent=t('copied');$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2500)}catch{window.prompt(t('share'),location.href)}});
setLanguage();

</script></body></html>
